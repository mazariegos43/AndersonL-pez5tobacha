<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto</title>

<style>
body {
  background-image: url("fondo.jpeg");
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  font-family: Arial;
  text-align: center;
  margin: 0;
  color: white;
}

.navbar {
  background-color: brown;
  padding: 10px;
}

.menu-toggle {
  display: none;
  font-size: 28px;
  background: none;
  border: none;
  color: white;
}

.nav-links {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

.nav-links li {
  margin: 5px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
}

.nav-links a:hover {
  color: yellow;
}

section {
  margin: 40px auto;
  width: 80%;
  max-width: 500px;
  background-color: rgba(0, 0, 0, 0.5);
  padding: 20px;
  border-radius: 10px;
}

form {
  width: 100%;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  margin-top: 1em;
}

label {
  display: block;
  text-align: left;
  margin-bottom: 5px;
}

input, textarea {
  width: 100%;
  border: 1px solid #999;
  border-radius: 5px;
  padding: 8px;
}

textarea {
  height: 5em;
}

.button {
  text-align: center;
}

button {
  padding: 10px 20px;
  border: none;
  background-color: brown;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background-color: darkred;
}

@media (max-width: 768px) {

  .menu-toggle {
    display: block;
    margin: auto;
  }

  .nav-links {
    display: none;
    flex-direction: column;
  }

  .nav-links.active {
    display: flex;
  }

  section {
    width: 90%;
    margin: 20px auto;
  }
}
</style>

</head>

<body>

<nav class="navbar">
  <button class="menu-toggle" id="menu-toggle">☰</button>

  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="presentacion.html">Presentación</a></li>
    <li><a href="academico.html">Académico</a></li>
    <li><a href="laborales.html">Laborales</a></li>
    <li><a href="hobbies.html">Hobbies</a></li>
    <li><a href="referencias.html">Referencias</a></li>
    <li><a href="estilo.html">Contacto</a></li>
  </ul>
</nav>

<section>
  <h1>Contacto</h1>

  <form action="https://formspree.io/f/mgorakqr" method="POST">

    <ul>
      <li>
        <label>Nombre:</label>
        <input type="text" name="name" required>
      </li>

      <li>
        <label>Correo:</label>
        <input type="email" name="email" required>
      </li>

      <li>
        <label>Mensaje:</label>
        <textarea name="message" required></textarea>
      </li>

      <li class="button">
        <button type="submit">Enviar</button>
      </li>
    </ul>

  </form>

</section>

<script>
document.getElementById("menu-toggle").onclick = function () {
  document.getElementById("nav-links").classList.toggle("active");
};
</script>

</body>
</html>
